# Generates Beeline.xcodeproj (not committed): `scripts/generate.sh`.
# Sources are folder globs, so adding a file never needs an edit here.
name: Beeline
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
# Defaults in Config/Base.xcconfig, which includes your git-ignored Config/Secrets.xcconfig.
# Values that differ per builder (bundle ID, team, alerts server) live there, not here:
# settings in this file would win over both.
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  configs:
    Debug:
      BEELINE_DISPLAY_NAME: Beeline
    Release:
      BEELINE_DISPLAY_NAME: "Beeline: Maps and Navigation"
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "4"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  Beeline:
    type: application
    platform: iOS
    sources:
      - path: Beeline
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(BEELINE_BUNDLE_ID)"
        PRODUCT_NAME: Beeline
        # Must be set per target: XcodeGen's iOS target default ("1,2") wins otherwise.
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Beeline/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Beeline/Resources/Beeline.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: BeelineWidgets
      - target: BeelineNotifications
  # Puts a line's disc on its alert as it arrives (a notification service extension).
  BeelineNotifications:
    type: app-extension
    platform: iOS
    sources:
      - path: BeelineNotifications
      - path: Beeline/Shared/LineSender.swift
    info:
      path: BeelineNotifications/Info.plist
      properties:
        CFBundleName: Beeline
        CFBundleDisplayName: "$(BEELINE_DISPLAY_NAME)"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(BEELINE_BUNDLE_ID).notifications"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
  # The trip's Live Activity (Lock Screen and Dynamic Island).
  BeelineWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: BeelineWidgets
      - path: Beeline/Shared
    info:
      path: BeelineWidgets/Info.plist
      properties:
        CFBundleName: Beeline
        CFBundleDisplayName: "$(BEELINE_DISPLAY_NAME)"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(BEELINE_BUNDLE_ID).widgets"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
  # Provider parsers against recorded responses, and the merge/rank engine. No network.
  BeelineTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BeelineTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(BEELINE_BUNDLE_ID).tests"
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: Beeline
schemes:
  Beeline:
    build:
      targets:
        Beeline: all
    test:
      config: Debug
      targets: [BeelineTests]
    run:
      config: Debug
    archive:
      config: Release
